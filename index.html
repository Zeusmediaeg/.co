            .rv.in {
                opacity: 1;

            }

        input, textarea, select {
            width: 100%;
            background: #052721;
            border: 1px solid var(--b);

            padding: 10px 12px;

        }

            input:focus, textarea:focus, select:focus {

            }

            font-size: 14px;
            color: var(--m);
            display: block
        }

        .cg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px
        }

        .dash {
            display: grid;
            grid-template-columns: 210px 1fr;
            gap: 20px;
            padding: 30px 0
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

            .side button {
                text-align: right;
                background: var(--s);
                border: 1px solid var(--b);

            }

        .box {

        #toast {

            left: 50%;

            color: #062c25;
            padding: 6px 20px;

        }

            #toast.s {

            }

        .err {

        }

        @media(max-width:760px) {

            }

            }

                padding-top: 40px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }

                opacity: 1;
                transform: none

        }

const hero=()=>{const h=D.home;return`<section class="hero"><div class="w"><div><span class="bdg rv">${esc(h.badge)}</span><h1 class="rv">${esc(h.title)}</h1><p class="rv">${esc(h.sub)}</p><a class="btn rv" style="background:${esc(D.site.color)}" href="${wa('أهلاً، عايز أشترك في باقة إنترنت')}" target="_blank" rel="noopener">${esc(h.cta)}</a><div class="stats rv">${h.stats.map(s=>`<div><b>${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join('')}</div></div><div class="sig"><i></i><i></i><i></i><b>5G<small>${esc(D.site.name)}</small></b></div></div></section>`};
const prov=()=>{const x=D.providers,l=x.items.map(i=>`<span>${esc(i.t)}</span>`).join('');return`<div class="mq"><div>${l.repeat(6)}</div></div>`};
const sh=x=>`<h2 class="rv">${esc(x.title)}</h2>${x.sub?`<p class="sub rv">${esc(x.sub)}</p>`:''}`;
const pk=n=>{const x=D.packages,it=n?x.items.slice(0,n):x.items;return`<section class="sec"><div class="w">${sh(x)}<div class="grid">${it.map(i=>`<div class="card rv"><span class="tag">${esc(i.tag)}</span><h3>${esc(i.t)}</h3><div class="pr" style="color:${esc(D.site.color)}">${esc(i.p)}<small>${esc(i.u)}</small></div><ul>${String(i.d).split('\n').filter(Boolean).map(f=>`<li>${esc(f)}</li>`).join('')}</ul><a class="btn" style="background:${esc(D.site.color)}" href="${wa('أهلاً، عايز أطلب: '+i.t+' ('+i.tag+')')}" target="_blank" rel="noopener">اطلب الباقة</a></div>`).join('')}</div>${n?`<p style="text-align:center;margin-top:24px"><a class="btn g" href="#/packages">كل الباقات</a></p>`:''}</div></section>`};
const steps=()=>{const x=D.about;return`<section class="sec"><div class="w">${sh(x)}<div class="grid">${x.items.map((i,n)=>`<div class="card rv"><div class="num">${n+1}</div><h3>${esc(i.t)}</h3><p>${esc(i.d)}</p></div>`).join('')}</div></div></section>`};
const faqv=()=>{const x=D.faq;return`<section class="sec"><div class="w" style="max-width:800px">${sh(x)}${x.items.map(i=>`<details class="rv"><summary>${esc(i.t)}</summary><p>${esc(i.d)}</p></details>`).join('')}</div></section>`};
const ctav=()=>`<section class="sec"><div class="w"><div class="cta rv"><h2>جاهز تشترك؟</h2><a class="btn" style="background:${esc(D.site.color)}" href="${wa('أهلاً، عايز أشترك في باقة إنترنت')}" target="_blank" rel="noopener">${esc(D.home.cta)}</a></div></div></section>`;
const contactv=()=>{const c=D.contact;return`<section class="sec"><div class="w">${sh(c)}<div class="cg"><div class="card rv"><h3>بيانات التواصل</h3><p>📞 ${esc(c.phone)}<br>✉️ ${esc(c.email)}<br>📍 ${esc(c.address)}<br>🕘 ${esc(c.hours)}</p></div><form class="card rv" onsubmit="return lead(event)"><label>الاسم<input name="n" required></label><label>رقم الجوال<input name="p" required inputmode="tel"></label><label>المزوّد<select name="s">${D.providers.items.map(i=>`<option>${esc(i.t)}</option>`).join('')}</select></label><label>المدينة / الحي<input name="c"></label><button class="btn" style="background:${esc(D.site.color)}">أرسل على واتساب</button></form></div></div></section>`};
function lead(e){e.preventDefault();const f=e.target.elements;window.open(wa(`الاسم: ${f.n.value}\nالجوال: ${f.p.value}\nالمزوّد: ${f.s.value}\nالمدينة: ${f.c.value}`),'_blank');return false}
function page(r){return r==='packages'?pk():r==='about'?steps()+ctav():r==='faq'?faqv()+ctav():r==='contact'?contactv():hero()+prov()+pk(3)+steps()+ctav()}
/* ---------- login & dashboard ---------- */
const loginv=()=>`<div class="box card"><h2 style="margin-bottom:14px">تسجيل الدخول</h2><form onsubmit="return login(event)"><label>اسم المستخدم<input id="lu" autocomplete="username" required></label><label>كلمة المرور<input id="lp" type="password" autocomplete="current-password" required></label><div class="err" id="le"></div><button class="btn" style="width:100%">دخول</button></form><p style="margin-top:14px"><a href="#/home" style="color:var(--m)">← رجوع للموقع</a></p></div>`;
async function login(e){e.preventDefault();if(await check($('#lu').value.trim(),$('#lp').value)){sessionStorage.setItem(SK,'1');location.hash='#/dashboard'}else $('#le').textContent='بيانات الدخول غير صحيحة';return false}
const F=(p,l,a)=>`<label>${l}${a?`<textarea rows="${a}" data-p="${p}">${esc(get(p))}</textarea>`:`<input data-p="${p}" value="${esc(get(p))}">`}</label>`;
const LST=s=>{const f=FLD[s];return D[s].items.map((it,i)=>`<div class="item">${f.map(([k,l,a])=>F(`${s}.items.${i}.${k}`,l,a)).join('')}<button class="btn r" data-del="${s}.${i}">حذف</button></div>`).join('')+`<button class="btn g" data-add="${s}">+ إضافة</button>`};
const SEC=s=>F(s+'.title','عنوان القسم')+F(s+'.sub','وصف تحت العنوان');
function tabv(){const t=tab;
if(t==='site')return F('site.name','اسم الموقع')+F('site.tagline','الشعار / الوصف')+F('site.whatsapp','رقم واتساب (بكود الدولة وبدون +)')+`<label>لون الأزرار<input type="color" data-p="site.color" value="${esc(D.site.color)}"></label>`;
if(t==='home')return F('home.badge','الشارة فوق العنوان')+F('home.title','العنوان الرئيسي',2)+F('home.sub','الوصف',3)+F('home.cta','نص الزر')+[0,1,2].map(i=>F(`home.stats.${i}.n`,`رقم ${i+1}`)+F(`home.stats.${i}.l`,`وصف الرقم ${i+1}`)).join('');
if(t==='contact')return SEC('contact')+F('contact.phone','الهاتف')+F('contact.email','البريد')+F('contact.address','العنوان')+F('contact.hours','ساعات العمل');
if(FLD[t])return SEC(t)+LST(t);
if(t==='acc')return`<p class="sub">المستخدم الحالي: <b>${esc(auth()?.u||'admin')}</b></p><label>كلمة المرور الحالية<input id="cp" type="password"></label><label>اسم مستخدم جديد<input id="nu"></label><label>كلمة مرور جديدة (6 حروف على الأقل)<input id="np" type="password"></label><label>تأكيد كلمة المرور<input id="np2" type="password"></label><div class="err" id="ae"></div><button class="btn" data-act="pass">تغيير بيانات الدخول</button>`;
return`<p class="sub">التعديلات بتتحفظ في متصفحك أنت بس. علشان الزوار يشوفوها: صدّر الملف وارفعه على GitHub جنب index.html بنفس الاسم data.json.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="exp">تصدير data.json</button><label class="btn g" style="margin:0;cursor:pointer">استيراد ملف<input id="imp" type="file" accept=".json" hidden></label><button class="btn r" data-act="reset">رجوع للنسخة المنشورة</button></div>`}
const dashv=()=>`<header><div class="w"><span class="logo"><i></i>لوحة التحكم</span><nav><a href="#/home">عرض الموقع</a><a href="#" data-act="out">خروج</a></nav></div></header><div class="w dash"><div class="side">${TABS.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div><div class="card" style="transform:none">${tabv()}</div></div>`;
/* ---------- router ---------- */
let io;
function render(){const r=location.hash.replace('#/','')||'home';
document.documentElement.style.setProperty('--c',D.site.color);document.title=D.site.name;
if(r==='admin')app.innerHTML=loginv();
else if(r==='dashboard'){if(!logged())return location.hash='#/admin';app.innerHTML=dashv()}
else{app.innerHTML=head(r)+page(r)+foot();scrollTo(0,0)}
io?.disconnect();io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&(x.target.classList.add('in'),io.unobserve(x.target))),{threshold:.12});
document.querySelectorAll('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%4*90)+'ms';io.observe(el)})}
async function chPass(){const a=auth(),cur=a?.u||'admin',e=$('#ae'),nu=$('#nu').value.trim(),np=$('#np').value;
if(!await check(cur,$('#cp').value))return e.textContent='كلمة المرور الحالية غلط';
if(!nu||np.length<6)return e.textContent='اكتب اسم مستخدم وكلمة مرور (6 حروف على الأقل)';
if(np!==$('#np2').value)return e.textContent='تأكيد كلمة المرور مش مطابق';
localStorage.setItem(AK,JSON.stringify({u:nu,h:await sha(np)}));e.style.color='var(--g)';e.textContent='تم التغيير ✓';render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='data.json';a.click()}
app.addEventListener('input',e=>{const p=e.target.dataset.p;if(p){set(p,e.target.value);save()}});
app.addEventListener('change',e=>{if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{D=merge(JSON.parse(t));save();render()}catch(x){alert('الملف غير صالح')}})}});
app.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-del],[data-add],[data-act]');if(!t)return;const d=t.dataset;
if(d.tab){tab=d.tab;render()}
if(d.del){const[s,i]=d.del.split('.');D[s].items.splice(+i,1);save();render()}
if(d.add){D[d.add].items.push(Object.fromEntries(FLD[d.add].map(f=>[f[0],'جديد'])));save();render()}
if(d.act==='out'){e.preventDefault();sessionStorage.removeItem(SK);location.hash='#/admin'}
if(d.act==='pass')await chPass();
if(d.act==='exp')exp();
if(d.act==='reset'&&confirm('هترجع للنسخة المنشورة وتتمسح تعديلات المتصفح. متأكد؟')){localStorage.removeItem(KEY);location.reload()}});
addEventListener('hashchange',render);
load().then(render);
    </script>
</body>
</html>
